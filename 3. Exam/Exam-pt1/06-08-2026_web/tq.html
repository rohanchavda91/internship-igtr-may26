<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Complete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #1d9a8a;
            --accent-dark: #0f6d65;
            --text: #22313f;
            --muted: #61707f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef5ff 0%, #f7fbff 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: min(420px, 100%);
            background: white;
            border: 2px solid #bfe8e1;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(16, 40, 70, 0.12);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            color: var(--accent-dark);
            margin-bottom: 10px;
            font-size: 1.7rem;
        }

        p {
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 22px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>સબમિટ થઈ ગયું!!</h1>
        <p>Thank you for submitting your task. Your work has been received and is being reviewed.</p>
        <a href="index.html">Back to Home</a>
    </div>
</body>
</html>
