<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected Photoshop, retouching, compositing, and art direction work by Rohan.">
    <title>Work - Rohan</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
   <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="index.html">R<span>O</span>HAN</a>
            <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="gallery.html">Work</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="page-hero">
            <div class="container page-hero-inner reveal">
                <div><span class="eyebrow">Selected projects</span>
                    <h1>A little bit<br>of everything.</h1>
                </div>
                <p class="lede">A mix of campaign worlds, quiet objects, and images that refuse to behave.</p>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="filter-bar reveal">
                    <button class="filter-button active" data-filter="all">All work</button>
                    <button class="filter-button" data-filter="color">Color</button>
                    <button class="filter-button" data-filter="lighting">Lighting</button>
                    <button class="filter-button" data-filter="typography">Typography</button>
                </div>
                <div class="gallery-grid">
                    <figure class="gallery-item reveal" data-category="color">
                        <img src="work%20images/enhanced-colors.jpg" alt="Enhanced Colors Photoshop artwork">
                    </figure>
                    <figure class="gallery-item reveal" data-category="lighting">
                        <img src="work%20images/street-light-effect.png" alt="Street Light Effect Photoshop artwork">
                    </figure>
                    <figure class="gallery-item reveal" data-category="typography">
                        <img src="work%20images/typography.jpg" alt="Typography Photoshop artwork">
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>© <span data-year></span> Rohan Studio</span>
            <div class="footer-links">
                <a href="gallery.html">Instagram</a>
                <a href="contact.html">Email</a>
            </div>
        </div>
    </footer>
