<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-position</title>
    <style>
        .image-container {
            width: 200px;
            height: 300px;
            border: 1px solid black;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 80% 100%;
        }
    </style>
</head>

<body>
    <h2>Image</h2>
    <div class="image-container">
        <img src="./../Image%20Styling/image.png" alt="Pineapple" class="img2">
    </div>
</body>

</html>
