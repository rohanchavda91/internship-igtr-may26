<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: 'Roboto', sans-serif;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        div.polaroid {
            width: 80%;
            background-color: white;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            margin-bottom: 25px;
            max-width: 60%;
        }

        div.container {
            text-align: center;
            padding: 10px 20px;
        }

        /* Responsive Image Gallery */
        div.gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        div.gallery-item {
            margin: 5px;
            border: 1px solid #ccc;
            width: calc(25% - 20px);
        }

        div.gallery-item:hover {
            border: 1px solid #777;
        }

        div.gallery-item img {
            width: 100%;
            height: auto;
        }

        div.gallery-item div.desc {
            padding: 15px;
            text-align: center;
        }

        @media only screen and (max-width: 768px) {
            div.gallery-item {
                width: calc(50% - 20px);
            }
        }

        @media only screen and (max-width: 480px) {
            div.gallery-item {
                width: calc(100% - 20px);
            }
        }
    </style>
</head>

<body>
    <h2>Responsive Image</h2>
    <img class="a" src="./../../06-06-2026/display/nibbles.png">

    <div class="polaroid">
        <img src="./../../06-06-2026/display/nibbles.png" alt="5 Terre" style="width:100%">
        <div class="container">
            <p>Cinque Terre</p>
        </div>
    </div>

    <div class="polaroid">
        <img src="./../../06-06-2026/display/nibbles.png" alt="Norther Lights" style="width:100%">
        <div class="container">
            <p>Northern Lights</p>
        </div>
    </div>

    <br>
    <br>

    <h2>Responsive Image Gallery</h2>

    <h4>Resize the browser window to see the effect!</h4>

    <div class="gallery">

        <div class="gallery-item">
            <a target="_blank" href="img_5terre.jpg">
                <img src="./../../06-06-2026/display/nibbles.png" alt="Nibbles Mouse" width="600" height="400">
            </a>
            <div class="desc">Nibbles Mouse</div>
        </div>
        <div class="gallery-item">
            <a target="_blank" href="img_5terre.jpg">
                <img src="./../../06-06-2026/display/nibbles.png" alt="Nibbles Mouse" width="600" height="400">
            </a>
            <div class="desc">Nibbles Mouse</div>
        </div>
        <div class="gallery-item">
            <a target="_blank" href="img_5terre.jpg">
                <img src="./../../06-06-2026/display/nibbles.png" alt="Nibbles Mouse" width="600" height="400">
            </a>
            <div class="desc">Nibbles Mouse</div>
        </div>
        <div class="gallery-item">

            </a>
            <div class="desc">Nibbles Mouse</div>
        </div>
    </div>
</body>

</html>
