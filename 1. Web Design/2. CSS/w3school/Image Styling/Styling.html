<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: 'Roboto', sans-serif;

        img {
            height: 300px;

        img.a {
            border-radius: 8px;
        }

        img.b {
            border-radius: 50%;

            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
        }

</head>

<body>
    <h2>Rounded Image</h2>
    <img class="a" src="./../../06-06-2026/display/nibbles.png">
    <br>
    <h2>Circular Image</h2>
    <img class="b" src="./../../06-06-2026/display/nibbles.png">
    <br>
    <h2>Thumbnail Image</h2>
    <img class="c" src="./../../06-06-2026/display/nibbles.png">
</body>

</html>
