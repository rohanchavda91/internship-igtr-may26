<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .imagess {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .container {
            position: relative;
            width: 250px;
            margin: 10px;
        }

        .image {
            display: inline-block;
            width: 250px;
            height: auto;
        }

        .overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            transition: .5s ease;
            background-color: #008CBA;
        }

        .container:hover .overlay {
            opacity: 1;
        }

        .container:hover .image {
            opacity: 0.3;
            transition: .5s ease-in-out;
        }

        .text {
            color: white;
            font-size: 20px;
            font-family: 'Roboto', 'calibri', 'noto color emoji';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);

        }

        .middle {
            transition: .5s ease-in-out;
            width: 100px;
            height: 50px;
            background-color: brown;
            opacity: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%)
        }

        .container:hover .middle {
            opacity: 1;
        }

        .overlay1 {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background-color: #008CBA;
            overflow: hidden;
            width: 100%;
            height: 0;
            transition: .5s ease;
        }

        .container:hover .overlay1 {
            bottom: 0;
            height: 100%;
        }

        .fimage{
            width: 250px;
            height: auto;
        }

        .container:hover .fimage{
            transform: scalex(-1);
        }
    </style>
</head>

<body>
    <div class="imagess">
        <div class="container">
            <img src="./image.png" alt="Avatar" class="image">
            <div class="overlay">
                <div class="text">👋👋</div>
            </div>
        </div>
        <div class="container">
            <img src="./image.png" alt="Avatar" class="image">
            <div class="middle">
                <div class="text">🔥🔥</div>
            </div>
        </div>
        <div class="container">
            <img src="./image.png" alt="Avatar" class="image">
            <div class="overlay1">
                <div class="text">👋👋</div>
            </div>
        </div>
        <div class="container">
            <img src="./imagi.png" alt="Avatar" class="fimage">
        </div>
    </div>
</body>

</html>
