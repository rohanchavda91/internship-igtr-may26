<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #697386;
            --line: #dce2ec;
            --accent: #e05b3f;
            --accent-dark: #b83e2a;
            --panel: #ffffff;
            --background: #f4f1ea;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            align-items: center;
            background: linear-gradient(135deg, #f4f1ea 0%, #e4edf2 100%);
            color: var(--ink);
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: var(--panel);
            border-top: 7px solid var(--accent);
            box-shadow: 0 18px 50px rgba(23, 32, 51, 0.14);
            max-width: 450px;
            padding: 42px;
            width: 100%;
        }

        h1 {
            line-height: 1;
            margin: 0 0 12px;
        }

        .intro {
            line-height: 1.6;
            margin: 0 0 28px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin: 18px 0 7px;
        }

        input {
            border: 1px solid var(--line);
            border-radius: 3px;
            color: var(--ink);
            font-size: 1rem;
            padding: 13px 14px;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent);
            outline: 3px solid rgba(224, 91, 63, 0.18);
        }

        button {
            background: var(--accent);
            border: 0;
            border-radius: 3px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 26px;
            padding: 14px 18px;
            width: 100%;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .data-link {
            color: var(--accent-dark);
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 22px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>Login</h1>
        <p class="intro">Enter your details below to continue.</p>
        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" required>

            <button type="submit">Submit login</button>
        </form>
        <a class="data-link" href="data.html">View submitted login data</a>
    </main>
    <script src="script.js"></script>
</body>
</html>
