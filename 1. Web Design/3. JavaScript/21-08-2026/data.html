<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login Data</title>
    <style>
        :root {
            --ink: #172033;
            --muted: #697386;
            --line: #dce2ec;
            --accent: #e05b3f;
            --background: #f4f1ea;
        }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #f4f1ea 0%, #e4edf2 100%);
            color: var(--ink);
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 42px 24px;
        }

        main { margin: auto; max-width: 1050px; }

        header {
            align-items: end;
            display: flex;
            justify-content: space-between;
            margin-bottom: 26px;
            gap: 20px;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            margin: 0 0 10px;
            text-transform: uppercase;
        }

        h1 { font: 700 clamp(2rem, 6vw, 3.4rem) Georgia, serif; margin: 0; }
        .summary { color: var(--muted); margin: 10px 0 0; }

        .actions { display: flex; gap: 10px; }
        .actions a, .actions button {
            border: 1px solid var(--ink);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            font-weight: 700;
            padding: 11px 14px;
            text-decoration: none;
        }
        .actions button { border-color: var(--accent); color: var(--accent); }

        .table-wrap {
            background: #fff;
            box-shadow: 0 18px 50px rgba(23, 32, 51, 0.12);
            overflow-x: auto;
        }

        table { border-collapse: collapse; min-width: 650px; width: 100%; }
        th, td { border-bottom: 1px solid var(--line); padding: 16px 18px; text-align: left; }
        th { background: var(--ink); color: #fff; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }
        td { font-size: 0.95rem; }
        tbody tr:last-child td { border-bottom: 0; }
        .empty { color: var(--muted); padding: 42px 18px; text-align: center; }

        @media (max-width: 620px) {
            body { padding: 28px 14px; }
            header { align-items: start; flex-direction: column; }
            .actions { width: 100%; }
            .actions a, .actions button { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">Local records</p>
                <h1>Login data</h1>
                <p class="summary" id="recordSummary">No submitted records yet.</p>
            </div>
            <div class="actions">
                <a href="login.html">Back to login</a>
                <button id="clearData" type="button">Clear data</button>
            </div>
        </header>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Password</th>
                        <th>Submitted</th>
                    </tr>
                </thead>
                <tbody id="loginDataBody"></tbody>
            </table>
            <p class="empty" id="emptyMessage">No login data has been submitted.</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
